# SwiftLint Configuration for DyadSampleApp

# Rules to enable
opt_in_rules:
  - empty_count
  - explicit_init
  - file_header
  - force_unwrapping
  - implicitly_unwrapped_optional
  - overridden_super_call
  - redundant_nil_coalescing
  - sorted_imports
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces

# Rules to disable
disabled_rules:
  - trailing_whitespace

# File options
excluded:
  - .build
  - build
  - DerivedData
  - Pods
  - vendor

# Line length
line_length:
  warning: 120
  error: 150
  ignores_comments: true
  ignores_urls: true

# Function body length
function_body_length:
  warning: 40
  error: 60

# File length
file_length:
  warning: 500
  error: 1000
  ignore_comment_only_lines: true

# Type body length
type_body_length:
  warning: 300
  error: 400

# Identifier name length
identifier_name:
  min_length:
    warning: 2
    error: 1
  max_length:
    warning: 40
    error: 50
  excluded:
    - id
    - url
    - URL

# Reporter
reporter: "xcode"
