name: iOS CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'ios/**'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'ios/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-build-and-test:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      
      - name: Show Xcode version
        run: xcodebuild -version
      
      - name: Install SwiftLint
        run: brew install swiftlint
      
      - name: Run SwiftLint
        working-directory: ios/DyadSampleApp
        run: |
          swiftlint version
          swiftlint lint --reporter github-actions-logging || true
      
      - name: Build iOS App
        working-directory: ios/DyadSampleApp
        run: |
          xcodebuild clean build \
            -project DyadSampleApp.xcodeproj \
            -scheme DyadSampleApp \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty || exit 1
      
      - name: Run Unit Tests
        working-directory: ios/DyadSampleApp
        run: |
          xcodebuild test \
            -project DyadSampleApp.xcodeproj \
            -scheme DyadSampleApp \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty || exit 1
      
      - name: Archive build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-${{ github.sha }}
          path: |
            ios/DyadSampleApp/build/
          retention-days: 7
      
      - name: Summary
        if: always()
        run: |
          echo "### iOS Build Summary :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Xcode Version**: $(xcodebuild -version | head -n 1)" >> $GITHUB_STEP_SUMMARY
          echo "- **Swift Version**: $(swift --version | head -n 1)" >> $GITHUB_STEP_SUMMARY
